<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Twenty Years Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root {
    --porcelain: #e6e3dc; --paper: #f1eee7; --ink: #141a2e; --ink-2: #3a4360; --muted: #636b88;
    --cobalt: #2244a8; --cobalt-2: #6f86cf; --cobalt-3: #b9c6ec; --gold: #9c7424; --gold-2: #d9bb7b; --line: #d2cdc1;
    --on-cobalt: #ffffff; --chip: #e3dfd5;
    --shade: 0 1px 2px rgba(20,26,46,.06), 0 22px 44px -28px rgba(20,26,46,.45);
    --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --f-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    --map-sea: #b4c4e4; --map-sea-2: #8199d2; --map-shadow: #34508f; --map-land: #ece6d8; --map-coast: #d9c79d; --map-grat: rgba(255,255,255,.6); --map-ink: #141a2e; --map-dim-ink: #55607f; --map-hot: #2244a8; --map-arc: #c08a2e; --map-plane: #9c7424; --map-accent: #9c7424; --map-on-accent: #ffffff; --map-dim: #a3abc4; --map-line: #cdc8bb; --map-paper: #f1eee7; --map-font: "Hanken Grotesk", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --porcelain: #0b0f1c; --paper: #121a2d; --ink: #eef1f8; --ink-2: #c0c8df; --muted: #8d96b3;
      --cobalt: #93a9ff; --cobalt-2: #5e75c4; --cobalt-3: #34457c; --gold: #dcb96f; --gold-2: #8f7331; --line: #24304c;
      --on-cobalt: #0b0f1c; --chip: #18223a;
      --shade: 0 1px 2px rgba(0,0,0,.5), 0 22px 44px -28px rgba(0,0,0,.9); color-scheme: dark;
      --map-sea: #172a63; --map-sea-2: #070c1f; --map-shadow: #000000; --map-land: #24345f; --map-coast: #3c5288; --map-grat: rgba(255,255,255,.07); --map-ink: #eef1f8; --map-dim-ink: #b3bdd9; --map-hot: #93a9ff; --map-arc: #e8c47a; --map-plane: #f2d58f; --map-accent: #dcb96f; --map-on-accent: #0b0f1c; --map-dim: #4d5878; --map-line: #24304c; --map-paper: #121a2d;
    }
  }
  :root[data-theme="dark"] {
    --porcelain: #0b0f1c; --paper: #121a2d; --ink: #eef1f8; --ink-2: #c0c8df; --muted: #8d96b3;
    --cobalt: #93a9ff; --cobalt-2: #5e75c4; --cobalt-3: #34457c; --gold: #dcb96f; --gold-2: #8f7331; --line: #24304c;
    --on-cobalt: #0b0f1c; --chip: #18223a;
    --shade: 0 1px 2px rgba(0,0,0,.5), 0 22px 44px -28px rgba(0,0,0,.9); color-scheme: dark;
    --map-sea: #172a63; --map-sea-2: #070c1f; --map-shadow: #000000; --map-land: #24345f; --map-coast: #3c5288; --map-grat: rgba(255,255,255,.07); --map-ink: #eef1f8; --map-dim-ink: #b3bdd9; --map-hot: #93a9ff; --map-arc: #e8c47a; --map-plane: #f2d58f; --map-accent: #dcb96f; --map-on-accent: #0b0f1c; --map-dim: #4d5878; --map-line: #24304c; --map-paper: #121a2d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--porcelain); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
@media (min-width: 1600px) { html { font-size: 112%; } body { font-size: 19px; } }
a { color: var(--cobalt); }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 12px; top: 12px; z-index: 99; background: var(--paper); padding: 8px 12px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* pasek: góra na komputerze i projektorze, dół na telefonie */
.bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 10px clamp(16px, 3vw, 36px); background: color-mix(in srgb, var(--porcelain) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--f-display); font-style: italic; font-size: 1.25rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs a { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .95rem; }
.tabs a svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--porcelain); }
.tabs a:hover:not([aria-current]) { background: var(--chip); }
.cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--gold); color: #fff; font-size: .72rem; display: inline-grid; place-items: center; }
.more { position: relative; }
.ico { width: 42px; height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: 1.3rem; cursor: pointer; }
.pop { position: absolute; right: 0; top: 50px; display: flex; flex-direction: column; min-width: 210px; padding: 6px; border-radius: 12px; background: var(--paper); box-shadow: var(--shade); border: 1px solid var(--line); }
.pop button { text-align: left; padding: 11px 12px; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer; }
.pop button:hover { background: var(--chip); }
@media (max-width: 760px) {
  .bar { padding: 8px 16px; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--porcelain); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; gap: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: color-mix(in srgb, var(--paper) 96%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs a { flex-direction: column; gap: 2px; padding: 8px 4px 9px; border-radius: 0; font-size: .74rem; justify-content: center; }
  .tabs a[aria-current="page"] { background: none; color: var(--cobalt); }
  .cnt { position: absolute; top: 4px; right: calc(50% - 24px); }
  .brand { margin-right: auto; }
  main { padding-bottom: 76px; }
}

/* układ widoków */
main { outline: none; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 3.5vw, 40px); }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 20px 0 6px; font-size: .9rem; color: var(--muted); }
.crumbs a { color: var(--ink-2); text-decoration: none; font-weight: 600; } .crumbs a:hover { text-decoration: underline; }
.vh { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; margin: 8px 0 22px; }
.vh h1 { font-size: clamp(2.1rem, 5vw, 3.6rem); }
.vh p { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; }
.eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button, .seg button { font: inherit; font-size: .9rem; font-weight: 600; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); cursor: pointer; }
.chips button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--porcelain); }
.seg { display: inline-flex; gap: 0; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); padding: 3px; }
.seg button { border: 0; padding: 7px 14px; background: none; }
.tools { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 22px; }
.tools .lab { font-size: .82rem; color: var(--muted); font-weight: 600; margin-right: -8px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 999px; background: var(--gold); color: #fff; border: 0; font: inherit; font-weight: 700; font-size: 1.05rem; text-decoration: none; cursor: pointer; box-shadow: var(--shade); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-size: .95rem; padding: 10px 18px; }
.empty { padding: 26px; border: 1px dashed var(--line); border-radius: 12px; color: var(--ink-2); background: var(--paper); }
.fade { animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

/* Start */
.hero { position: relative; min-height: calc(100svh - 63px); display: grid; align-items: end; color: #fff; overflow: hidden; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,12,28,.15) 0%, rgba(8,12,28,.25) 45%, rgba(8,12,28,.82) 100%); }
.hero .in { position: relative; z-index: 1; padding: 0 clamp(16px, 5vw, 64px) clamp(28px, 7vh, 80px); max-width: 980px; }
.hero h1 { font-size: clamp(2.8rem, 8vw, 6.4rem); }
.hero h1 i { color: var(--gold-2); }
.hero p { font-size: clamp(1.05rem, 2vw, 1.3rem); max-width: 44ch; margin: 14px 0 24px; opacity: .95; }
.clock { display: flex; gap: 28px; margin-bottom: 26px; }
.clock b { display: block; font-family: var(--f-display); font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 400; line-height: 1; }
.clock span { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.hero .cred { position: absolute; right: 12px; bottom: 8px; z-index: 1; font-size: .7rem; opacity: .7; }
@media (max-width: 760px) { .hero { min-height: calc(100svh - 58px - 64px); } }

/* karty kierunków */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 20px; }
.pc { position: relative; display: flex; flex-direction: column; background: var(--paper); border-radius: 14px; overflow: hidden; box-shadow: var(--shade); color: inherit; text-decoration: none; transition: transform .2s ease; min-width: 0; }
.pc:hover { transform: translateY(-3px); }
.pc .ph { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(135deg, var(--cobalt-3), var(--cobalt-2)); }
.pc .ph img { width: 100%; height: 100%; object-fit: cover; }
.pc .rk { position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(8,12,28,.7); color: #fff; font-size: .8rem; font-weight: 700; }
.pc .plan { position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 999px; background: var(--gold); color: #fff; font-size: .76rem; font-weight: 700; }
.pc .bd { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pc h3 { font-size: 1.6rem; }
.pc .ct { font-size: .85rem; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
.pc .why { color: var(--ink-2); font-size: .96rem; margin: 0; flex: 1; }
.nums { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: var(--ink-2); padding-top: 10px; border-top: 1px solid var(--line); }
.nums b { color: var(--ink); font-size: 1rem; }
.heart { position: absolute; right: 10px; top: 10px; z-index: 2; width: 42px; height: 42px; border-radius: 999px; border: 0; background: rgba(255,255,255,.92); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.heart svg { width: 21px; height: 21px; fill: none; stroke: #b3263e; stroke-width: 2; }
.heart[aria-pressed="true"] svg { fill: #d33a55; }
.heart.inl { position: static; box-shadow: none; border: 1px solid var(--line); background: var(--paper); }
.tierlab { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.tierlab.t1 { background: var(--gold); color: #fff; } .tierlab.t2 { background: var(--cobalt); color: var(--on-cobalt); } .tierlab.t3 { border: 1px solid var(--line); color: var(--muted); }
.tierlab.t4 { background: var(--chip); color: var(--muted); font-weight: 700; }
.mapbox { border-radius: 14px; overflow: hidden; box-shadow: var(--shade); margin-bottom: 26px; }

/* kierunek */
.dh { position: relative; min-height: min(62vh, 620px); display: grid; align-items: end; color: #fff; border-radius: 0 0 18px 18px; overflow: hidden; }
.dh img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dh::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,12,28,0) 30%, rgba(8,12,28,.85)); }
.dh .in { position: relative; z-index: 1; padding: 0 clamp(16px, 4vw, 48px) 28px; max-width: 1240px; width: 100%; margin: 0 auto; }
.dh h1 { font-size: clamp(2.6rem, 7vw, 5rem); }
.dh p { max-width: 60ch; font-size: 1.08rem; margin: 10px 0 0; }
.dh .cred { position: absolute; right: 12px; bottom: 6px; z-index: 1; font-size: .7rem; opacity: .75; }
.dh .cred a { color: #fff; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 22px 0 8px; }
.facts div { background: var(--paper); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shade); }
.facts b { display: block; font-family: var(--f-display); font-size: 1.5rem; font-weight: 400; line-height: 1.15; }
.facts span { font-size: .84rem; color: var(--ink-2); }
.sec { margin: 44px 0 16px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.sec h2 { font-size: clamp(1.8rem, 3.6vw, 2.5rem); }
.wowl { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.wowl li { background: var(--paper); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shade); color: var(--ink-2); border-top: 3px solid var(--gold); }
.gal { display: grid; grid-auto-flow: column; grid-auto-columns: min(78%, 460px); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
.gal figure { margin: 0; scroll-snap-align: start; }
.gal img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; }
.gal figcaption { font-size: .76rem; color: var(--muted); margin-top: 5px; }
.hl { display: grid; gap: 14px; }
.hcard { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 0; background: var(--paper); border-radius: 14px; overflow: hidden; box-shadow: var(--shade); }
.hcard > img, .hcard > .noimg { width: 100%; height: 100%; min-height: 170px; object-fit: cover; background: linear-gradient(135deg, var(--cobalt-3), var(--cobalt-2)); }
.hcard .bd { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hcard .top { display: flex; gap: 10px; align-items: start; justify-content: space-between; }
.hcard h3 { font-size: 1.45rem; }
.hcard .why { margin: 0; color: var(--ink-2); }
.hcard details { font-size: .92rem; color: var(--ink-2); }
.hcard summary { cursor: pointer; font-weight: 600; color: var(--cobalt); }
.hcard .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
.cmpck { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.risk { font-size: .86rem; color: var(--ink-2); background: color-mix(in srgb, var(--gold-2) 18%, var(--paper)); border-radius: 8px; padding: 6px 10px; }
@media (max-width: 640px) { .hcard { grid-template-columns: 1fr; } .hcard > img, .hcard > .noimg { aspect-ratio: 16 / 9; min-height: 0; } }
.days { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.day { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 18px; background: var(--paper); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shade); }
.day .dt b { display: block; font-family: var(--f-display); font-size: 1.9rem; font-weight: 400; line-height: 1; }
.day .dt span { font-size: .82rem; color: var(--muted); }
.day h3 { font-size: 1.35rem; margin-bottom: 6px; }
.day p { margin: 0; color: var(--ink-2); }
.day img { margin-top: 12px; border-radius: 10px; aspect-ratio: 16 / 8; object-fit: cover; width: 100%; }
.day.anniv { background: linear-gradient(180deg, color-mix(in srgb, var(--gold-2) 24%, var(--paper)), var(--paper)); border: 1px solid var(--gold); }
.day.anniv .dt b { color: var(--gold); }
@media (max-width: 640px) { .day { grid-template-columns: 1fr; gap: 6px; } }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.box { background: var(--paper); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shade); color: var(--ink-2); font-size: .96rem; }
.box h3 { font-size: 1.3rem; color: var(--ink); margin-bottom: 8px; }
.box ul { margin: 0; padding-left: 18px; } .box li { margin: 4px 0; }
.bud { list-style: none; padding: 0; margin: 0; } .bud li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.bud li.sum { font-weight: 700; color: var(--ink); border: 0; }
.soon { background: var(--paper); border-radius: 14px; padding: 22px; box-shadow: var(--shade); border-left: 4px solid var(--gold); }
.next { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 40px 0 30px; }

/* wybór i porównanie */
.cmpt { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--paper); border-radius: 14px; overflow: hidden; box-shadow: var(--shade); }
.cmpt th, .cmpt td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; font-size: .95rem; }
.cmpt thead th { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; }
.cmpt tbody th { color: var(--muted); font-weight: 600; font-size: .85rem; width: 150px; }
.cmpt .best { color: var(--gold); font-weight: 700; }
.scroll { overflow-x: auto; }
.pick { margin-top: 26px; padding: 24px; border-radius: 14px; background: var(--ink); color: var(--porcelain); }
.pick h2 { font-size: 2rem; }

/* ranking */
.rt { width: 100%; border-collapse: collapse; background: var(--paper); border-radius: 14px; overflow: hidden; box-shadow: var(--shade); font-size: .93rem; }
.rt th, .rt td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
.rt th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); cursor: pointer; white-space: nowrap; }
.rt td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.rt tr.x td { background: var(--chip); }
.rt a { color: var(--ink); font-weight: 600; text-decoration: none; } .rt a:hover { text-decoration: underline; }
.crit { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 22px; }
.crit li { display: grid; grid-template-columns: 9em minmax(0, 1fr) 2.2em; gap: 8px; align-items: center; font-size: .85rem; color: var(--ink-2); }
.crit i { display: block; height: 7px; border-radius: 9px; background: var(--chip); overflow: hidden; } .crit i s { display: block; height: 100%; background: var(--cobalt); }
.crit b { text-align: right; color: var(--ink); }
@media (max-width: 760px) { .rt .hm { display: none; } }
.note { color: var(--ink-2); font-size: .95rem; max-width: 75ch; }
footer { margin: 50px 0 30px; font-size: .8rem; color: var(--muted); }

.mapbox .wm-bar { display: none; }
.mapbox { background: var(--paper); }
.seg { flex-wrap: wrap; border-radius: 22px; }
.seg button { white-space: nowrap; border-radius: 999px; }
@media (max-width: 760px) { .seg button { padding: 7px 11px; font-size: .86rem; } }

/* zegar czasu lotu */
:root { --zg: #2e9d5b; --zy: #e3b22b; --zr: #d2483c; }
.clk { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
.clk svg { width: 46px; height: 29px; overflow: visible; }
.clk path { fill: none; stroke-width: 9; }
.clk .zg { stroke: var(--zg); } .clk .zy { stroke: var(--zy); } .clk .zr { stroke: var(--zr); }
.clk .tk line { stroke: var(--muted); stroke-width: 1.2; }
.clk .nd { stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; }
.clk .hub { fill: var(--ink); }
.clk b { font-size: .95rem; color: var(--ink); }
.clk.kg b { color: var(--zg); } .clk.ky b { color: #a57d0c; } .clk.kr b { color: var(--zr); }

window.initMap = function (scope) {
  scope.querySelectorAll('.wmap').forEach(function (root) {
    var svg = root.querySelector('svg'), tip = root.querySelector('.wm-tip'), box = root.querySelector('.wm-box');
    var full = svg.getAttribute('viewBox').split(' ').map(Number), cur = full.slice(), target = full.slice(), anim = null;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function fit(v) {
      var a = (box.clientWidth || 1000) / (box.clientHeight || 420), x = v[0], y = v[1], w = v[2], h = v[3];
      if (w / h > a) { var nh = w / a; y -= (nh - h) / 2; h = nh; } else { var nw = h * a; x -= (nw - w) / 2; w = nw; }
      return [x, y, w, h];
    }
    function setVB(v) {
      cur = v; var f = fit(v); svg.setAttribute('viewBox', f.map(function (n) { return n.toFixed(1); }).join(' '));
      var k = full[2] / v[2], px = f[2] / (box.clientWidth || 1000);
      var rr = Math.max(9, Math.min(19, 7.5 * Math.sqrt(k))) * px, rd = Math.max(4, Math.min(6, 3.4 * Math.sqrt(k))) * px;
      svg.querySelectorAll('.mk').forEach(function (a) {
        var d = a.querySelector('.dot'), h = a.querySelector('.halo'), t = a.querySelector('text');
        var dim = a.classList.contains('dim'), R = dim ? rd * .8 : a.classList.contains('t1') ? rr * 1.3 : a.classList.contains('t2') ? rr * .8 : rd * 1.15;
        d.setAttribute('r', R.toFixed(2));
        var c = a.querySelector('.clip'), im = a.querySelector('.pin');
        if (c) { c.setAttribute('r', (R - 1.2 * px).toFixed(2)); im.setAttribute('x', (+d.getAttribute('cx') - R).toFixed(2)); im.setAttribute('y', (+d.getAttribute('cy') - R).toFixed(2)); im.setAttribute('width', (2 * R).toFixed(2)); im.setAttribute('height', (2 * R).toFixed(2)); }
        if (h) h.setAttribute('r', (R * 1.15).toFixed(2));
        a.dataset.R = R / px;
        t.style.fontSize = (12 * px).toFixed(2) + 'px'; t.style.strokeWidth = (3 * px).toFixed(2) + 'px';
        t.setAttribute('text-anchor', a.dataset.an || 'start');
        var off = (+a.dataset.R || 6) + 4, ddx = +a.dataset.dx || 9;
        t.setAttribute('x', (+d.getAttribute('cx') + (ddx < 0 ? -off : off) * px).toFixed(1)); t.setAttribute('y', (+d.getAttribute('cy') + (+a.dataset.dy || 4) * px).toFixed(1));
      });
      svg.querySelectorAll('.pl').forEach(function (pl) { pl.setAttribute('transform', 'scale(' + (px * 1.15).toFixed(3) + ')'); });
      var hr = svg.querySelector('.hring'), hd = svg.querySelector('.hdot'), hl = svg.querySelector('.hlab');
      if (hr) { hr.setAttribute('r', (7 * px).toFixed(2)); hd.setAttribute('r', (3 * px).toFixed(2)); hl.style.fontSize = (11 * px).toFixed(2) + 'px'; hl.style.strokeWidth = (3 * px).toFixed(2) + 'px';
        hl.setAttribute('x', (+hd.getAttribute('cx') + 9 * px).toFixed(1)); hl.setAttribute('y', (+hd.getAttribute('cy') - 7 * px).toFixed(1)); }
      root.classList.toggle('zoomed', k > 1.6);
    }
    function go(to) {
      if (anim) cancelAnimationFrame(anim);
      if (reduce) { setVB(to); return; }
      var from = cur.slice(), t0 = null;
      function step(t) { if (!t0) t0 = t; var p = Math.min(1, (t - t0) / 750), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        setVB(from.map(function (a, i) { return a + (to[i] - a) * e; })); if (p < 1) anim = requestAnimationFrame(step); }
      anim = requestAnimationFrame(step);
    }
    root.querySelectorAll('.wm-bar button').forEach(function (b) {
      b.addEventListener('click', function () {
        root.querySelectorAll('.wm-bar button').forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
        tip.hidden = true; target = pick(b); go(target);
      });
    });
    function pick(b) { return ((box.clientWidth < 700 ? b.dataset.mview : b.dataset.view) || b.dataset.view).split(' ').map(Number); }
    function arcOn(a, on) { var arc = svg.querySelector('.arc[data-i="' + a.dataset.i + '"]'); if (arc) arc.classList.toggle('on', on); a.classList.toggle('on', on); }

      d.appendChild(b); if (a.dataset.s) d.appendChild(s); if (a.dataset.v) d.appendChild(e); tip.appendChild(d);

      var r = a.querySelector('.dot').getBoundingClientRect(), br = box.getBoundingClientRect();
      var x = r.left - br.left + r.width / 2, y = r.top - br.top, w = tip.offsetWidth, h = tip.offsetHeight;

<script>

  function seg(name, opts, cur) { return '<span class="seg" role="group" aria-label="' + esc(name) + '">' + opts.map(function (o) { return '<button type="button" data-' + o[0] + '="' + o[1] + '" aria-pressed="' + (String(cur) === String(o[1])) + '">' + esc(o[2]) + '</button>'; }).join('') + '</span>'; }

  function regChips() { return '<span class="chips" role="group" aria-label="Kierunek">' + REG.map(function (r) { return '<button type="button" data-reg="' + r[0] + '" aria-pressed="' + (S.reg === r[0]) + '">' + r[1] + '</button>'; }).join('') + '</span>'; }
  function crumbs(list) { return '<nav class="crumbs" aria-label="Jesteś tutaj">' + list.map(function (c, i) { return i < list.length - 1 ? '<a href="' + c[1] + '">' + esc(c[0]) + '</a><span aria-hidden="true">›</span>' : '<span aria-current="page">' + esc(c[0]) + '</span>'; }).join('') + '</nav>'; }
  function visiblePlaces() { return D.places.filter(function (p) { return (!S.reg || p.reg === S.reg) && p.tier <= S.lvl; }); }

  // --- widoki ---
  function vStart() {
    var c = D.cover, now = new Date(), dep = new Date(2027, 10, 6), ann = new Date(2027, 10, 10);
    var dd = function (d) { return Math.max(0, Math.ceil((d - now) / 864e5)); };
    var nPlan = D.places.filter(function (p) { return p.prog; }).length;
    return '<section class="hero">' + img(c, '', true, '100vw') +
      '<div class="in fade"><p class="eyebrow" style="color:var(--gold-2)">20. rocznica · 6–13 listopada 2027 · dwie pary</p>' +
      '<h1>Dwadzieścia lat.<br><i>Dokąd teraz?</i></h1>' +
      '<p>Wybieramy razem jedno miejsce i jeden hotel na tydzień, którego nie zapomnimy: widoki, design i codziennie szlak.</p>' +
      '<div class="clock"><div><b>' + dd(dep) + '</b><span>dni do wylotu</span></div><div><b>' + dd(ann) + '</b><span>dni do rocznicy</span></div><div><b>' + nPlan + '</b><span>gotowe plany</span></div></div>' +
      '<a class="btn" href="#/kierunki">Zacznijmy →</a></div>' +
      (c && c.cap ? '<span class="cred">' + esc(c.cap) + '</span>' : '') + '</section>';
  }

  function placeCard(p) {
    var g = p.gal[0], c = pcost(p);
    return '<article class="pc fade"><a href="#/kierunek/' + p.id + '" style="display:contents;color:inherit;text-decoration:none">' +
      '<div class="ph">' + img(g) + '<span class="rk">' + dec(p.sc) + '</span>' + (p.prog ? '<span class="plan">plan dzień po dniu</span>' : '') + '</div>' +
      '<div class="bd"><span class="ct">' + esc(p.ctry) + '</span><h3>' + esc(p.name) + '</h3><p class="why">' + esc(p.why) + '</p>' +
      '<div class="nums">' + clock(p.fh, p.fhe, false) + '<span>od <b>' + nf(c) + ' zł</b> na parę</span>' + (p.tmax != null ? '<span><b>' + p.tmax + ' °C</b> · ' + (p.rd != null ? p.rd + ' dni z deszczem' : '') + '</span>' : '') + '<span>' + p.hotels.length + ' ' + (p.hotels.length === 1 ? 'hotel' : p.hotels.length < 5 ? 'hotele' : 'hoteli') + '</span></div></div></a>' +
      heart(p.id, p.name) + '</article>';
  }
  function vKierunki() {
    var list = visiblePlaces(), n = list.length;
    var h = '<div class="wrap">' + crumbs([['Start', '#/'], ['Kierunki']]) +
      '<div class="vh"><div><h1>Dokąd lecimy?</h1><p>' + ({ 1: 'Faworyci: ocena od 8,1.', 2: 'Faworyci i mocne alternatywy: ocena od 7,8.', 3: 'Do tego miejsca warte rozważenia: ocena od 7,4.', 4: 'Wszystkie miejsca, także te z wyraźnym kompromisem.' })[S.lvl] + ' Kliknijcie miejsce, żeby zobaczyć hotele i plan dnia. Serduszkiem odkładacie je do wyboru.</p></div></div>' +
      '<div class="tools">' + regChips() + seg('Które miejsca', [['lvl', 1, 'Faworyci'], ['lvl', 2, '+ alternatywy'], ['lvl', 3, '+ do rozważenia'], ['lvl', 4, 'Wszystkie']], S.lvl) + seg('Widok', [['mode', 'cards', 'Karty'], ['mode', 'map', 'Mapa']], S.mode) + daysSeg() + '</div>';
    if (S.mode === 'map') h += '<div class="mapbox" id="mapslot"></div>';
    h += n ? '<div class="grid">' + list.map(placeCard).join('') + '</div>' : '<p class="empty">W tym kierunku nie ma miejsc w tej grupie. Wybierzcie szerszą grupę albo „Wszystkie”.</p>';
    return h + '</div>';
  }

  function hotelCard(h, p) {
    var b = p.prog && p.prog.budgets[h.n], inCmp = S.cmp.indexOf(h.id) >= 0;
    return '<article class="hcard" id="h-' + h.id + '">' + (h.img ? '<img src="' + h.img + '" alt="" loading="lazy">' : img(p.gal[0])) +
      '<div class="bd"><div class="top"><div><span class="tierlab t' + h.tier + '">' + TIERN[h.tier] + '</span> <span class="ct">#' + h.rk + ' w rankingu</span><h3>' + esc(h.n) + '</h3></div>' + heart(h.id, h.n, true) + '</div>' +
      (h.fpen ? '<p class="risk">Ocena obniżona o ' + dec(h.fpen) + ' za lot dłuższy niż 13 h — przy 7 dniach tracicie część wyjazdu.</p>' : '') +
      '<p class="why">' + esc(h.why) + '</p>' +
      (h.op ? '<p class="op">' + esc(h.op) + '</p>' : '') +
      (h.atr && h.atr.length ? '<div class="atr"><span class="lab">W okolicy</span><ul>' + h.atr.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="nums"><span><b>' + dec(h.sc) + '</b> ocena</span>' + (h.katl ? '<span><b>' + esc(h.katl) + '</b></span>' : '') + '<span><b>' + nf(cost(h)) + ' zł</b> na parę · ' + (S.nn + 1) + ' dni' + (h.pk && S.nn === 7 && cost(h) === h.pk ? ' (pakiet biura podróży)' : '') + '</span><span>' + esc(h.oc) + '</span></div>' +
      (h.unit ? '<p class="note" style="margin:0">' + esc(h.unit) + '</p>' : '') +
      '<details><summary>Szczegóły i słabe strony</summary><p>' + esc(h.note) + '</p>' + (b && b.note ? '<p>' + esc(b.note) + '</p>' : '') + '</details>' +
      (h.rnote ? '<p class="risk">Ryzyko: ' + esc(h.risk) + ' · ' + esc(h.rnote) + '</p>' : '') +
      '<div class="acts"><label class="cmpck"><input type="checkbox" data-cmp="' + h.id + '"' + (inCmp ? ' checked' : '') + '> porównaj</label>' + (h.url ? '<a class="btn ghost" href="' + esc(h.url) + '" target="_blank" rel="noopener">Strona hotelu ↗</a>' : '') + '</div></div></article>';
  }
  function vKierunek(id) {
    var p = P[id];
    if (!p) return '<div class="wrap">' + crumbs([['Start', '#/'], ['Kierunki', '#/kierunki'], ['Nie znaleziono']]) + '<p class="empty">Nie ma takiego miejsca. <a href="#/kierunki">Wróćcie do listy kierunków.</a></p></div>';
    var g = p.gal[0], hs = p.hotels.map(function (i) { return H[i]; }), pr = p.prog;
    var h = '<section class="dh">' + img(g, '', true, '100vw') + '<div class="in fade">' + crumbs([['Kierunki', '#/kierunki'], [p.name]]).replace('class="crumbs"', 'class="crumbs" style="color:#fff"').replace(/style="color:var\(--ink-2\)"/g, '') +
      '<p class="eyebrow" style="color:var(--gold-2)">' + esc(p.ctry) + ' · ocena ' + dec(p.sc) + ' · ' + TIERN[p.tier] + '</p><h1>' + esc(p.name) + '</h1><p>' + esc((pr && pr.tagline) || p.teaser || p.why) + '</p></div>' +
      (g && g.cap ? '<span class="cred">' + esc(g.cap) + (g.page ? ' · <a href="' + esc(g.page) + '" target="_blank" rel="noopener">źródło</a>' : '') + '</span>' : '') + '</section><div class="wrap">';
    h += '<div class="facts">' +
      '<div><b>od ' + nf(pcost(p)) + ' zł</b><span>na parę, ' + (S.nn + 1) + ' dni, limit 26 000 zł</span></div>' +
      (p.fh != null ? '<div class="fclk">' + clock(p.fh, p.fhe, true) + '<span>' + (p.flight ? esc(p.flight) : 'lot z Warszawy (szacunek z odległości, z przesiadką przy dalekich trasach)') + '</span></div>' : '') +
      (p.wx ? '<div><b>' + (p.tmax != null ? p.tmax + ' °C' : '') + '</b><span>Listopad: ' + esc(p.wx) + '</span></div>' : '') +
      (p.sun ? '<div><b>' + p.sun[0] + ' – ' + p.sun[1] + '</b><span>wschód i zachód słońca 10.11</span></div>' : '') + '</div>';
    if (p.wow && p.wow.length) h += '<div class="sec"><h2>Dlaczego niezapomniane</h2></div><ul class="wowl">' + p.wow.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
    h += '<div class="sec" id="hotele"><h2>' + (hs.length === 1 ? 'Hotel' : 'Hotele') + ' w tym miejscu</h2>' + daysSeg() + '</div><div class="hl">' + hs.map(function (x) { return hotelCard(x, p); }).join('') + '</div>';
    if (pr) {
      h += '<div class="sec" id="plan"><h2>Plan dzień po dniu</h2><span class="note">bazą jest ' + esc(hs[0].n) + '</span></div><ol class="days">' + pr.days.map(function (d) {
        return '<li class="day' + (d.anniv ? ' anniv' : '') + '"><div class="dt"><b>' + esc(d.date) + '</b><span>' + esc(d.dow || '') + (d.anniv ? ' · rocznica' : '') + '</span></div><div><h3>' + esc(d.title) + '</h3><p>' + esc(d.text) + '</p>' + (d.img ? img(d.img, '', false, '(max-width: 760px) 100vw, 900px') : '') + '</div></li>';
      }).join('') + '</ol>';
      var bn = hs[0].n, b = pr.budgets[bn];
      var BL = [['nocleg', 'Nocleg'], ['loty', 'Loty'], ['auto_transfery', 'Auto i transfery'], ['jedzenie', 'Jedzenie'], ['wycieczki_bilety', 'Wycieczki i bilety'], ['rezerwa', 'Rezerwa']];
      h += '<div class="sec"><h2>Budżet i przygotowania</h2></div><div class="cols">' +
        (b ? '<div class="box"><h3>Budżet na parę</h3><p class="note" style="margin:0 0 8px">' + esc(bn) + ', 8 dni</p><ul class="bud">' + BL.map(function (r) { return b[r[0]] != null ? '<li><span>' + r[1] + '</span><span>' + nf(b[r[0]]) + ' zł</span></li>' : ''; }).join('') + '<li class="sum"><span>Razem</span><span>' + nf(b.razem) + ' zł</span></li></ul></div>' : '') +
        (pr.dojazd ? '<div class="box"><h3>Dojazd</h3><p>' + esc(pr.dojazd) + '</p></div>' : '') +
        (pr.rezerwacje ? '<div class="box"><h3>Co i kiedy rezerwować</h3><ul>' + pr.rezerwacje.map(function (r) { return '<li><b>' + esc(r.when) + ':</b> ' + esc(r.what) + '</li>'; }).join('') + '</ul></div>' : '') +
        (pr.zabrac ? '<div class="box"><h3>Co zabrać</h3><ul>' + pr.zabrac.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>' : '') +
        (pr.uwagi ? '<div class="box"><h3>Warto wiedzieć</h3><ul>' + pr.uwagi.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>' : '') + '</div>';
      if (pr.zrodla) h += '<p class="note">Źródła: ' + pr.zrodla.map(function (z) { return '<a href="' + esc(z.url) + '" target="_blank" rel="noopener">' + esc(z.label) + '</a>'; }).join(' · ') + '</p>';
    } else {
      h += '<div class="sec" id="plan"><h2>Plan dzień po dniu</h2></div><div class="soon"><p style="margin-top:0"><b>Planu dla tego miejsca jeszcze nie ma.</b> Jeśli Wam się podoba, dodajcie je serduszkiem do wyboru i poproście o plan: „zrób plan dla ' + esc(p.name) + '”.</p>' + heart(p.id, p.name, true) + '</div>';
    }
    if (p.gal.length > 1) h += '<div class="sec"><h2>Galeria</h2></div><div class="gal">' + p.gal.slice(1).map(function (o) { return '<figure>' + img(o, '', false, '460px') + '<figcaption>' + esc(o.t ? o.t + ' · ' : '') + esc(o.cap) + '</figcaption></figure>'; }).join('') + '</div>';
    var L = visiblePlaces(); if (L.indexOf(p) < 0) L = D.places;
    var k = L.indexOf(p), pv = L[k - 1], nx = L[k + 1];
    h += '<nav class="next" aria-label="Sąsiednie kierunki">' + (pv ? '<a class="btn ghost" href="#/kierunek/' + pv.id + '">← ' + esc(pv.name) + '</a>' : '<span></span>') + '<a class="btn ghost" href="#/kierunki">Wszystkie kierunki</a>' + (nx ? '<a class="btn ghost" href="#/kierunek/' + nx.id + '">' + esc(nx.name) + ' →</a>' : '<span></span>') + '</nav>';
    return h + '</div>';
  }

  function vWybor() {
    var fp = S.fav.filter(function (i) { return P[i]; }).map(function (i) { return P[i]; });
    var fh = S.fav.filter(function (i) { return H[i]; }).map(function (i) { return H[i]; });
    var cmp = (S.cmp.length ? S.cmp : fh.map(function (x) { return x.id; })).filter(function (i) { return H[i]; }).slice(0, 3).map(function (i) { return H[i]; });
    var h = '<div class="wrap">' + crumbs([['Start', '#/'], ['Wybór']]) + '<div class="vh"><div><h1>Nasz wybór</h1><p>Miejsca i hotele odłożone serduszkiem. Zaznaczcie „porównaj” przy 2–3 hotelach, żeby zobaczyć je obok siebie.</p></div>' + daysSeg() + '</div>';
    if (!fp.length && !fh.length && !cmp.length) return h + '<div class="empty"><p style="margin-top:0">Jeszcze nic tu nie ma.</p><a class="btn" href="#/kierunki">Przeglądajcie kierunki →</a></div></div>';
    if (S.pick && H[S.pick]) { var ph = H[S.pick], pp = P[ph.pl]; h += '<div class="pick fade"><p class="eyebrow" style="color:var(--gold-2)">To nasz wybór</p><h2>' + esc(pp.name) + ' · ' + esc(ph.n) + '</h2><p>' + nf(cost(ph)) + ' zł na parę za ' + (S.nn + 1) + ' dni · ocena ' + dec(ph.sc) + '. <a style="color:var(--gold-2)" href="#/kierunek/' + pp.id + '">Plan i szczegóły →</a></p></div>'; }
    if (cmp.length) {
      var rows = [['Miejsce', function (x) { return '<a href="#/kierunek/' + x.pl + '">' + esc(P[x.pl].name) + '</a>'; }],
        ['Ocena', function (x) { return dec(x.sc); }, function (x) { return x.sc; }],
        ['Koszt na parę', function (x) { return nf(cost(x)) + ' zł'; }, function (x) { return -cost(x); }],
        ['Lot', function (x) { var p = P[x.pl]; return clock(p.fh, p.fhe, false) + (p.flight ? '<br>' + esc(p.flight) : ''); }, function (x) { return -(P[x.pl].fh || 99); }],
        ['Listopad', function (x) { return esc(P[x.pl].wx || '—'); }, function (x) { return P[x.pl].tmax || 0; }]];
      D.cr.forEach(function (c, i) { if (c.w >= 2) rows.push([c.l, function (x) { return x.s[i] != null ? String(x.s[i]).replace('.', ',') : '—'; }, function (x) { return x.s[i] || 0; }]); });
      rows.push(['Kategoria', function (x) { return esc(x.katl || '—'); }, function (x) { return x.st || 0; }]);
      rows.push(['Plan dnia', function (x) { return P[x.pl].prog ? 'jest' : 'jeszcze nie'; }]);
      rows.push(['Ryzyko', function (x) { return esc(x.risk || '—'); }]);
      h += '<div class="sec"><h2>Porównanie</h2></div><div class="scroll"><table class="cmpt"><thead><tr><th></th>' + cmp.map(function (x) { return '<th scope="col">' + esc(x.n) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function (r) { var best = r[2] ? Math.max.apply(null, cmp.map(r[2])) : null; return '<tr><th scope="row">' + r[0] + '</th>' + cmp.map(function (x) { return '<td' + (r[2] && cmp.length > 1 && r[2](x) === best ? ' class="best"' : '') + '>' + r[1](x) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '<tr><th scope="row"></th>' + cmp.map(function (x) { return '<td><button type="button" class="btn ghost" data-pick="' + x.id + '">' + (S.pick === x.id ? '✓ Nasz wybór' : 'To nasz wybór') + '</button></td>'; }).join('') + '</tr></tbody></table></div>';
    }
    if (fp.length) h += '<div class="sec"><h2>Odłożone miejsca</h2></div><div class="grid">' + fp.map(placeCard).join('') + '</div>';
    if (fh.length) h += '<div class="sec"><h2>Odłożone hotele</h2></div><div class="hl">' + fh.map(function (x) { return hotelCard(x, P[x.pl]); }).join('') + '</div>';
    return h + '</div>';
  }

  function vRankingPlaces() {
    var list = D.places.filter(function (p) { return (!S.reg || p.reg === S.reg) && (!S.q || (p.name + ' ' + p.ctry + ' ' + p.L).toLowerCase().indexOf(S.q) >= 0); });
    return '<div class="scroll"><table class="rt"><thead><tr><th>#</th><th>Miejsce</th><th class="hm">Kraj / region</th><th class="hm">Grupa</th><th>Lot</th><th>Najlepszy hotel</th><th>Ocena</th><th>Koszt od</th></tr></thead><tbody>' +
      list.map(function (p, i) { var b = H[p.hotels[0]]; return '<tr><td class="n">' + (i + 1) + '</td><td><a href="#/kierunek/' + p.id + '">' + esc(p.name) + '</a>' + (p.prog ? ' <span class="tierlab t1">plan</span>' : '') + '</td><td class="hm">' + esc(p.ctry) + '</td><td class="hm"><span class="tierlab t' + p.tier + '">' + TIERN[p.tier] + '</span></td><td class="n fl">' + clock(p.fh, p.fhe, false) + '</td><td>' + esc(b.n) + (p.hotels.length > 1 ? ' <span class="note">+' + (p.hotels.length - 1) + '</span>' : '') + '</td><td class="n"><b>' + dec(p.sc) + '</b></td><td class="n">' + nf(pcost(p)) + ' zł</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function vRanking() {
    var list = D.hotels.filter(function (h) { return (!S.reg || P[h.pl].reg === S.reg) && (!S.q || (h.n + ' ' + P[h.pl].L).toLowerCase().indexOf(S.q) >= 0); });
    var k = S.sort[0], dir = S.sort[1];
    list.sort(function (a, b) { var A = k === 'cost' ? cost(a) : k === 'n' ? a.n : k === 'fh' ? (P[a.pl].fh || 99) : (a[k] || 0), B = k === 'cost' ? cost(b) : k === 'n' ? b.n : k === 'fh' ? (P[b.pl].fh || 99) : (b[k] || 0); return (A > B ? 1 : A < B ? -1 : 0) * dir; });
    var h = '<div class="wrap">' + crumbs([['Start', '#/'], ['Jak wybieraliśmy']]) +
      '<div class="vh"><div><h1>Jak wybieraliśmy</h1><p>Cała pula: ' + D.hotels.length + ' hoteli w ' + D.places.length + ' miejscach (kierunek = miejsce, np. Teneryfa; w jednym miejscu bywa kilka hoteli), ' + D.cr.length + ' kryteriów dopasowanych do nas. Kliknijcie wiersz, żeby zobaczyć oceny, albo nazwę miejsca, żeby przejść do kierunku.</p></div></div>' +
      '<div class="tools">' + seg('Widok rankingu', [['rmode', 'pl', 'Miejsca'], ['rmode', 'h', 'Hotele']], S.rmode) + regChips() + daysSeg() + '<input type="search" id="rq" placeholder="Szukaj hotelu lub miejsca" value="' + esc(S.q) + '" style="font:inherit;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:220px"></div>' +
      (S.rmode === 'pl' ? vRankingPlaces() : '<div class="scroll"><table class="rt"><thead><tr>' + [['rk', '#'], ['n', 'Hotel'], ['', 'Miejsce'], ['tier', 'Grupa', 'hm'], ['st', 'Kategoria', 'hm'], ['fh', 'Lot'], ['sc', 'Ocena'], ['cost', 'Koszt na parę']].map(function (c) { return '<th' + (c[2] ? ' class="' + c[2] + '"' : '') + (c[0] ? ' data-sort="' + c[0] + '" aria-sort="' + (k === c[0] ? (dir > 0 ? 'ascending' : 'descending') : 'none') + '"' : '') + '>' + c[1] + (k === c[0] ? (dir > 0 ? ' ▲' : ' ▼') : '') + '</th>'; }).join('') + '</tr></thead><tbody>' +
      list.map(function (x) { var p = P[x.pl]; return '<tr data-row="' + x.id + '"><td class="n">' + x.rk + '</td><td>' + esc(x.n) + '</td><td><a href="#/kierunek/' + p.id + '">' + esc(p.name) + '</a></td><td class="hm"><span class="tierlab t' + x.tier + '">' + TIERN[x.tier] + '</span></td><td class="hm">' + esc(x.katl || '—') + '</td><td class="n fl">' + clock(p.fh, p.fhe, false) + '</td><td class="n"><b>' + dec(x.sc) + '</b></td><td class="n"' + (cost(x) > 26000 ? ' style="color:#b3263e"' : '') + '>' + nf(cost(x)) + ' zł</td></tr>'; }).join('') + '</tbody></table></div>') +
      '<div class="sec"><h2>Kryteria i wagi</h2></div><ul class="crit">' + D.cr.map(function (c) { return '<li><span>' + esc(c.l) + '</span><i><s style="width:' + (c.w / 3 * 100) + '%"></s></i><b>×' + String(c.w).replace('.', ',') + '</b></li>'; }).join('') + '</ul>' +
      '<p class="note">Każdy hotel ma ocenę 1–10 w każdym kryterium; wynik to średnia ważona. Najwięcej ważą widok i efekt wow (×3), potem design i aktywność (×2,5). Kategoria hotelu (×1) to gwiazdki: oficjalne albo, gdy hotel ich nie ma (lodże, ryokany, butiki), odpowiednik z serwisów rezerwacyjnych; 5★ = 10, 4★ = 8, 3★ = 6. Cztery grupy: faworyci od ' + String(D.t1).replace('.', ',') + ', mocne alternatywy od ' + String(D.t2).replace('.', ',') + ', warte rozważenia od ' + String(D.t4).replace('.', ',') + ', a poniżej ' + String(D.t4).replace('.', ',') + ' hotele z wyraźnym kompromisem. Koszt to cały wyjazd jednej pary: hotel, lot, auto, jedzenie, wycieczki i rezerwa; hotel liczony za liczbę nocy, reszta proporcjonalnie do dni. Rewizja v3: „swoboda” to łatwość podróży z pułapem dla kraju, w tropikach krótkie ulewy liczą się łagodniej, aktywność obejmuje też snorkeling i nurkowanie. Ceny to szacunki na bazie 2026 r. Wykluczyliśmy kraje z ostrzeżeniem MSZ 3–4, miejsca, w których już byliśmy lub których nie chcemy (Madera, Gran Canaria, Malta, Egipt, Albania, Grecja, Maroko, Karaiby, Douro, Etna), oraz hotele zamknięte w listopadzie.</p>';
    return h + '</div>';
  }
  function detailRow(x) {
    return '<tr class="x"><td colspan="8"><p class="note" style="margin-top:0">' + esc(x.note) + '</p><ul class="crit">' + D.cr.map(function (c, i) { var v = x.s[i]; return '<li><span>' + esc(c.l) + '</span><i><s style="width:' + (v * 10) + '%"></s></i><b>' + String(v).replace('.', ',') + '</b></li>'; }).join('') + '</ul><p><a href="#/kierunek/' + x.pl + '">Zobacz kierunek ' + esc(P[x.pl].name) + ' →</a>' + (x.url ? ' · <a href="' + esc(x.url) + '" target="_blank" rel="noopener">strona hotelu ↗</a>' : '') + '</p></td></tr>';
  }

  // --- routing z pamięcią przewijania ---
  var scrollMem = {}, curHash = null;
  function route() {
    if (!location.hash && window.START) { history.replaceState(null, '', window.START); }
    if (curHash !== null) scrollMem[curHash] = window.scrollY;
    var hs = location.hash || '#/', parts = hs.replace(/^#\/?/, '').split('/'), tab = parts[0] || 'start', html;
    if (tab === 'kierunki') html = vKierunki();
    else if (tab === 'kierunek') { html = vKierunek(parts[1]); tab = 'kierunki'; }
    else if (tab === 'wybor') html = vWybor();
    else if (tab === 'ranking') html = vRanking();
    else { html = vStart(); tab = 'start'; }
    view.innerHTML = html;
    document.querySelectorAll('.tabs a').forEach(function (a) { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var p = parts[0] === 'kierunek' && P[parts[1]];
    document.title = (p ? p.name + ' · ' : tab === 'kierunki' ? 'Kierunki · ' : tab === 'wybor' ? 'Nasz wybór · ' : tab === 'ranking' ? 'Ranking · ' : '') + 'Twenty Years Together';
    mountMap();
    var y = curHash !== hs && scrollMem[hs] != null ? scrollMem[hs] : 0;
    if (curHash === hs) y = window.scrollY;
    curHash = hs;
    window.scrollTo(0, y);
    paintFav();
  }
  function rerender() { var y = window.scrollY; view.innerHTML = ''; curHash = null; route(); window.scrollTo(0, y); }
  function mountMap() {
    var slot = document.getElementById('mapslot'); if (!slot) return;
    slot.appendChild(document.getElementById('maptpl').content.cloneNode(true));
    if (window.initMap) window.initMap(slot);
    var vb = slot.querySelectorAll('.wm-bar button'), ix = { '': 0, eu: 1, as: 2, am: 3, oi: 4, af: 0 }[S.reg] || 0; if (vb[ix]) vb[ix].click();
  }
  function paintFav() { var n = S.fav.length, b = document.getElementById('favn'); b.textContent = n; b.hidden = !n; }

  // --- zdarzenia ---
  view.addEventListener('click', function (e) {
    var t = e.target.closest('button, tr[data-row], th[data-sort]'); if (!t) return;
    var d = t.dataset;
    if (d.fav) { e.preventDefault(); var i = S.fav.indexOf(d.fav); if (i >= 0) S.fav.splice(i, 1); else S.fav.push(d.fav); persist(); t.setAttribute('aria-pressed', i < 0); paintFav(); if ((location.hash || '').indexOf('wybor') >= 0) rerender(); return; }
    if (d.reg != null) { S.reg = d.reg; persist(); rerender(); return; }
    if (d.lvl != null) { S.lvl = +d.lvl; persist(); rerender(); return; }
    if (d.rmode) { S.rmode = d.rmode; persist(); rerender(); return; }
    if (d.mode) { S.mode = d.mode; persist(); rerender(); return; }
    if (d.nn) { S.nn = +d.nn; persist(); rerender(); return; }
    if (d.pick) { S.pick = S.pick === d.pick ? null : d.pick; persist(); rerender(); return; }
    if (d.sort) { S.sort = [d.sort, S.sort[0] === d.sort ? -S.sort[1] : (d.sort === 'sc' ? -1 : 1)]; rerender(); return; }
    if (d.row && !e.target.closest('a')) { var nx = t.nextElementSibling; if (nx && nx.classList.contains('x')) nx.remove(); else t.insertAdjacentHTML('afterend', detailRow(H[d.row])); }
  });
  view.addEventListener('change', function (e) {
    var c = e.target.dataset && e.target.dataset.cmp; if (!c) return;
    var i = S.cmp.indexOf(c); if (e.target.checked && i < 0) { S.cmp.push(c); if (S.cmp.length > 3) S.cmp.shift(); } else if (!e.target.checked && i >= 0) S.cmp.splice(i, 1);
    persist();
  });
  view.addEventListener('input', function (e) { if (e.target.id === 'rq') { S.q = e.target.value.trim().toLowerCase(); var pos = e.target.selectionStart; rerender(); var q = document.getElementById('rq'); q.focus(); q.setSelectionRange(pos, pos); } });
  window.addEventListener('hashchange', route);

  // menu „⋯”: motyw i muzyka
  var mb = document.getElementById('morebtn'), pop = document.getElementById('morepop'), r = document.documentElement, tb = document.getElementById('thbtn');
  mb.addEventListener('click', function () { var o = pop.hidden; pop.hidden = !o; mb.setAttribute('aria-expanded', o); });
  document.addEventListener('click', function (e) { if (!e.target.closest('.more')) { pop.hidden = true; mb.setAttribute('aria-expanded', 'false'); } });
  try { var th = localStorage.getItem('rocz-theme'); if (th) r.setAttribute('data-theme', th); } catch (e) {}
  function isDark() { var t = r.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function paintTh() { tb.textContent = isDark() ? '☀ Tryb jasny' : '☾ Tryb ciemny (projektor)'; }
  tb.addEventListener('click', function () { var t = isDark() ? 'light' : 'dark'; r.setAttribute('data-theme', t); try { localStorage.setItem('rocz-theme', t); } catch (e) {} paintTh(); });
  paintTh();
  var au = document.getElementById('mus'), mu = document.getElementById('musbtn'), M = D.music || [], mk = 0;
  function mpaint(on) { mu.setAttribute('aria-pressed', on); mu.textContent = on ? '❚❚ ' + M[mk][1] : '♪ Włącz muzykę'; }
  mu.addEventListener('click', function () { if (!M.length) return; if (au.paused) { if (!au.src) au.src = M[mk][0]; au.volume = .6; var pl = au.play(); if (pl && pl.catch) pl.catch(function () { mpaint(false); }); mpaint(true); } else { au.pause(); mpaint(false); } });
  au.addEventListener('ended', function () { mk = (mk + 1) % M.length; au.src = M[mk][0]; au.play(); mpaint(true); });

  route();
})();

</script>
