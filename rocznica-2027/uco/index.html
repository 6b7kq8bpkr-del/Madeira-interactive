<!doctype html>
<html lang="pl">
<head>

<style>
/* Układ: dziennik podróży — duża fotografia Andów na otwarcie, potem oś dni jak kartki z winnicy; kolor wina malbec na szarości topól i kamienia rzecznego */
:root {
  --stone: #eceeea; --paper: #f8f8f5; --ink: #1d1a1f; --ink-2: #4a4550; --muted: #77707d;
  --malbec: #6d1f3a; --malbec-2: #a3405f; --poplar: #4f6a47; --adobe: #b9763d; --line: #d6d8d1; --chip: #e2e5de;
  --on-malbec: #ffffff; --shade: 0 1px 2px rgba(29,26,31,.06), 0 18px 40px -26px rgba(29,26,31,.45);
  --f-display: "Gloock", "Georgia", serif; --f-body: "Figtree", "Helvetica Neue", Arial, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --stone: #141116; --paper: #1d1920; --ink: #f1edf0; --ink-2: #c9c1c9; --muted: #958c97;
  --malbec: #d6809b; --malbec-2: #b0566f; --poplar: #93b088; --adobe: #e0a46a; --line: #332c35; --chip: #29232c;
  --on-malbec: #1d1a1f; --shade: 0 1px 2px rgba(0,0,0,.5), 0 18px 40px -26px rgba(0,0,0,.9); color-scheme: dark; } }
:root[data-theme="dark"] {
  --stone: #141116; --paper: #1d1920; --ink: #f1edf0; --ink-2: #c9c1c9; --muted: #958c97;
  --malbec: #d6809b; --malbec-2: #b0566f; --poplar: #93b088; --adobe: #e0a46a; --line: #332c35; --chip: #29232c;
  --on-malbec: #1d1a1f; --shade: 0 1px 2px rgba(0,0,0,.5), 0 18px 40px -26px rgba(0,0,0,.9); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--stone); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.62; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
@media (min-width: 1600px) { body { font-size: 19px; } }
a { color: var(--malbec); }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.08; margin: 0; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--adobe); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--adobe); }

/* nawigacja */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.nav b { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; white-space: nowrap; color: var(--malbec); }
.nav ul { list-style: none; display: flex; gap: 4px; margin: 0 0 0 auto; padding: 0; overflow-x: auto; scrollbar-width: none; }
.nav a { display: block; padding: 7px 12px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.nav a:hover, .nav a.on { background: var(--chip); color: var(--ink); }
.ico { width: 38px; height: 38px; flex: none; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 1rem; }
@media (max-width: 720px) { .nav b { display: none; } .nav ul { margin-left: 0; } }

/* otwarcie */
.hero { position: relative; color: #fff; background: #2a2226; overflow: hidden; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,14,18,.1) 0%, rgba(20,14,18,.35) 50%, rgba(20,14,18,.88) 100%); }
.hero .wrap { position: relative; z-index: 1; padding-block: clamp(140px, 30vh, 300px) 44px; text-shadow: 0 1px 14px rgba(0,0,0,.4); }
.hero h1 { font-size: clamp(3.2rem, 11vw, 8.5rem); letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: #e9b6c5; }
.hero p { max-width: 52ch; font-size: clamp(1.05rem, 2vw, 1.3rem); margin: 14px 0 0; }
.hero .eyebrow { color: #f0c59a; }
.hero .cred { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 8px; z-index: 1; font-size: .7rem; opacity: .75; }
.hero .cred a { color: #fff; }
.count { display: flex; flex-wrap: wrap; gap: 26px 40px; margin-top: 28px; }
.count div { display: flex; flex-direction: column; }
.count b { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1; }
.count span { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; opacity: .85; margin-top: 4px; }

/* sekcje */
section.blk { padding-block: clamp(44px, 7vw, 84px); }
.sh { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; margin-bottom: 26px; }
.sh h2 { font-size: clamp(2.1rem, 5vw, 3.4rem); }
.sh p { margin: 8px 0 0; color: var(--ink-2); max-width: 62ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats div { padding: 20px 18px; border-right: 1px solid var(--line); }
.stats div:last-child { border-right: 0; }
.stats b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 2rem; color: var(--malbec); line-height: 1.1; }
.stats span { font-size: .9rem; color: var(--ink-2); }
@media (max-width: 600px) { .stats div { border-right: 0; border-bottom: 1px solid var(--line); } }
.wow { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 30px; }
.wow p { margin: 0; padding-top: 14px; border-top: 2px solid var(--malbec); color: var(--ink-2); }

/* dni */
.days { display: flex; flex-direction: column; gap: 22px; }
.day { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--paper); border-radius: 6px; overflow: hidden; box-shadow: var(--shade); }
.day:nth-child(even) .ph { order: 2; }
.day .ph { position: relative; min-height: 260px; background: var(--chip); }
.day .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.day .ph figcaption { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: .7rem; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
.day .bd { padding: 26px 28px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.day .dt { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-mono); color: var(--muted); font-size: .85rem; }
.day .dt b { font-family: var(--f-display); font-weight: 400; font-size: 2.4rem; color: var(--ink); line-height: 1; }
.day h3 { font-size: 1.65rem; }
.day p { margin: 0; color: var(--ink-2); }
.day .cost { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); margin-top: auto; }
.day.anniv { outline: 2px solid var(--malbec); }
.day.anniv .dt b, .day.anniv h3 { color: var(--malbec); }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--malbec); color: var(--on-malbec); font-family: var(--f-body); font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
@media (max-width: 760px) { .day { grid-template-columns: 1fr; } .day:nth-child(even) .ph { order: 0; } .day .ph { min-height: 0; aspect-ratio: 16 / 10; } .day .bd { padding: 20px; } }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.flow li { padding: 14px; border-left: 2px solid var(--adobe); background: var(--paper); }
.flow b { display: block; font-family: var(--f-mono); color: var(--adobe); font-weight: 500; }

/* hotele i budżet */
.hsel { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.hc { text-align: left; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hc[aria-pressed="true"] { border-color: var(--malbec); box-shadow: 0 0 0 2px var(--malbec) inset; }
.hc h3 { font-size: 1.45rem; }
.hc .sum { font-family: var(--f-mono); font-size: .95rem; color: var(--malbec); }
.hc p { margin: 0; color: var(--ink-2); font-size: .95rem; }
.bud { margin-top: 28px; background: var(--paper); border-radius: 6px; padding: 24px; box-shadow: var(--shade); }
.bar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; margin: 14px 0 18px; }
.bar i { display: block; height: 100%; }
.leg { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 24px; }
.leg li { display: flex; align-items: center; gap: 10px; font-size: .95rem; }
.leg li s { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.leg li b { margin-left: auto; font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.total { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.total b { font-family: var(--f-display); font-weight: 400; font-size: 2.4rem; }
.limit { font-family: var(--f-mono); font-size: .85rem; color: var(--poplar); }
.bud .note { color: var(--ink-2); margin: 14px 0 0; font-size: .95rem; }
.c1 { background: var(--malbec); } .c2 { background: var(--adobe); } .c3 { background: var(--poplar); } .c4 { background: var(--malbec-2); } .c5 { background: var(--muted); } .c6 { background: var(--line); }

/* hotele */
.hg { display: grid; gap: 22px; }
.hk { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
.hk.main { border-color: var(--malbec); box-shadow: 0 0 0 2px var(--malbec) inset; }
.hk .ph { margin: 0; min-height: 260px; } .hk .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hk .hb { padding: 22px 24px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hk h3 { font-size: 1.6rem; }
.hk .kv { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .9rem; color: var(--ink-2); align-items: center; } .hk .kv b { color: var(--ink); font-weight: 600; }
.hk .tagw { padding: 2px 10px; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: .8rem; }
.hk .lead { margin: 0; font-weight: 500; } .hk .more { margin: 0; color: var(--ink-2); font-size: .92rem; }
.zp { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 20px; } .zp ul { margin: 0; padding: 0; list-style: none; font-size: .9rem; display: grid; gap: 4px; }
.zp li::before { content: "+ "; color: var(--poplar); font-weight: 700; } .zp ul.m li::before { content: "− "; color: var(--malbec); }
@media (max-width: 760px) { .hk { grid-template-columns: 1fr; } .hk .ph { min-height: 0; aspect-ratio: 16 / 10; } }
/* loty: tabela cen i trendów */
.pt { width: 100%; border-collapse: collapse; font-size: .9rem; } .pt th, .pt td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.pt th { font-family: var(--f-mono); font-weight: 500; font-size: .75rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.pt td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; } .pt td.n b { color: var(--malbec); font-weight: 600; } .pt tr.ok td.n b { color: var(--poplar); }
.pt .tr { font-family: var(--f-mono); font-size: .8rem; } .pt .up { color: var(--malbec); } .pt .dn { color: var(--poplar); } .pt .fl { color: var(--muted); }
.pt .rt { color: var(--muted); font-family: var(--f-mono); font-size: .78rem; display: block; }
.pt .sp { display: inline-flex; align-items: flex-end; gap: 2px; height: 22px; } .pt .sp i { width: 5px; background: var(--adobe); border-radius: 1px; display: block; } .pt .sp i.ok { background: var(--poplar); }
.ptw { overflow-x: auto; margin: 10px 0 0; }
.pt .or { color: var(--ink-2); white-space: nowrap; }
/* loty */
.fo { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.fo article { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fo article.rek { border-color: var(--malbec); box-shadow: 0 0 0 2px var(--malbec) inset; }
.fo h3 { font-size: 1.35rem; } .fo .rt { font-family: var(--f-mono); font-size: .85rem; color: var(--malbec); }
.fo .kv { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--ink-2); } .fo .kv b { color: var(--ink); font-weight: 600; }
.fo p { margin: 0; font-size: .95rem; color: var(--ink-2); } .fo .pm { display: grid; gap: 4px; } .fo .pm span::before { content: "+ "; color: var(--poplar); font-weight: 700; } .fo .pm span.m::before { content: "− "; color: var(--malbec); }
.mon { margin-top: 28px; background: var(--paper); border-radius: 6px; padding: 24px; box-shadow: var(--shade); display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px 40px; }
.mon > div { min-width: 0; }
@media (max-width: 760px) { .mon { grid-template-columns: 1fr; } }
.mon h3 { font-size: 1.5rem; margin-bottom: 8px; } .mon .st { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); margin: 0 0 10px; }
.mon .status { padding: 12px 14px; border-left: 3px solid var(--adobe); background: var(--chip); font-size: .95rem; margin: 0 0 14px; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
.hist li { display: grid; grid-template-columns: 96px 90px minmax(0, 1fr); gap: 10px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.hist b { font-family: var(--f-mono); font-weight: 500; color: var(--malbec); font-variant-numeric: tabular-nums; } .hist small { color: var(--muted); }
.hist li.ok b { color: var(--poplar); }
.al { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; } .al a { font-weight: 600; } .al span { display: block; color: var(--ink-2); font-size: .9rem; }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 70px; margin: 8px 0 4px; } .spark i { flex: 1; background: var(--adobe); border-radius: 2px 2px 0 0; min-width: 6px; } .spark i.ok { background: var(--poplar); }
/* przygotowania */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px 40px; }
.cols h3 { font-size: 1.5rem; margin-bottom: 12px; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.tl li { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; }
.tl b { font-family: var(--f-mono); font-weight: 500; font-size: .85rem; color: var(--malbec); }
.chk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.chk label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.chk input { margin-top: 5px; accent-color: var(--malbec); width: 18px; height: 18px; flex: none; }
.chk input:checked + span { text-decoration: line-through; color: var(--muted); }
.ul { margin: 0; padding-left: 18px; color: var(--ink-2); } .ul li { margin: 6px 0; }
.prose { color: var(--ink-2); max-width: 70ch; }

.scn { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero canvas.scn { z-index: 0; }
/* trasa */
.route { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.map { background: var(--paper); border-radius: 6px; box-shadow: var(--shade); overflow: hidden; }
.map > svg { display: block; width: 100%; height: auto; }
.map .andes { fill: var(--chip); } .map .snow { fill: var(--line); }
.map .rt { fill: none; stroke: var(--malbec); stroke-width: 3; stroke-dasharray: 7 6; }
.map .pt { fill: var(--malbec); stroke: var(--paper); stroke-width: 3; }
.map .pn { fill: var(--on-malbec); font: 700 13px var(--f-body); }
.map .lab { fill: var(--ink); font: 600 13px var(--f-body); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.map .sub { fill: var(--muted); font: 11px var(--f-mono); }
.map .ap { fill: var(--adobe); }
.stg { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.stg li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; }
.stg .n { width: 34px; height: 34px; border-radius: 999px; background: var(--malbec); color: var(--on-malbec); display: grid; place-items: center; font-weight: 700; }
.stg h3 { font-size: 1.35rem; }
.stg p { margin: 4px 0 0; color: var(--ink-2); font-size: .95rem; }
.stg .meta { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
@media (max-width: 820px) { .route { grid-template-columns: 1fr; } }
/* galeria */
.gal { columns: 3 260px; column-gap: 12px; }
.gal figure { margin: 0 0 12px; break-inside: avoid; }
.gal img { width: 100%; border-radius: 4px; cursor: zoom-in; }
.cred { color: inherit; opacity: .8; font-size: .92em; text-decoration: none; white-space: nowrap; }
.cred:hover { text-decoration: underline; }
.gal figcaption { font-size: .74rem; color: var(--muted); margin-top: 4px; }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(12,9,11,.92); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb img { max-height: 84vh; width: auto; border-radius: 4px; }
.lb p { color: #eee; font-size: .85rem; text-align: center; margin: 10px 0 0; }
.lb button { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; border-radius: 999px; border: 0; background: #fff; color: #111; font-size: 1.4rem; cursor: pointer; }
footer { padding-block: 40px 60px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Zdjęcie"><button type="button" id="lbx" aria-label="Zamknij">×</button><figure style="margin:0"><img id="lbi" alt=""><p id="lbc"></p></figure></div>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.UCO, X = D.x, P = D.prog, app = document.getElementById('app');
  function cred(p) { return p && p.au ? ' <a class="cred" href="' + esc(p.page) + '" target="_blank" rel="noopener">fot. ' + esc(p.au) + (p.lic ? ', ' + esc(p.lic) : '') + '</a>' : ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nf(n) { return Math.round(n).toLocaleString('pl-PL').replace(/ /g, ' '); }
  function load(k, d) { try { var v = localStorage.getItem('uco-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem('uco-' + k, JSON.stringify(v)); } catch (e) {} }
  function img(o, cls, eager, sizes) {
    if (!o) return '';
    return '<img class="' + (cls || '') + '" src="' + o.s + '" srcset="' + o.s + ' 720w, ' + o.l + ' 1800w" sizes="' + (sizes || '(max-width: 760px) 100vw, 600px') + '" alt="' + esc(o.cap) + '" data-l="' + o.l + '" data-cap="' + esc(o.cap) + '"' + (eager ? ' fetchpriority="high"' : ' loading="lazy"') + ' decoding="async">';
  }
  var now = new Date(), dd = function (d) { return Math.max(0, Math.ceil((d - now) / 864e5)); };
  var h = '';
  // otwarcie
  h += '<header class="hero" id="start">' + (D.hero ? img(D.hero, '', true, '100vw') : '<canvas class="scn" data-k="hero" data-seed="7" aria-hidden="true"></canvas>') + '<div class="wrap">' +
    '<p class="eyebrow">20. rocznica · 6–13 listopada 2027 · trzy pary · Mendoza, Argentyna</p>' +
    '<h1>Valle de Uco<br><em>i Zuccardi</em></h1>' +
    '<p>' + esc(P.tagline || X.teaser || '') + '</p>' +
    '<div class="count"><div><b>' + dd(new Date(2027, 10, 5)) + '</b><span>dni do wylotu</span></div><div><b>' + dd(new Date(2027, 10, 10)) + '</b><span>dni do rocznicy</span></div><div><b>' + X.temp + ' °C</b><span>w listopadzie</span></div></div>' +
    '</div>' + (D.hero ? '<span class="cred">' + esc(D.hero.cap) + ' · <a href="' + esc(D.hero.page) + '" target="_blank" rel="noopener">Wikimedia Commons</a></span>' : '') + '</header>';
  // fakty i „dlaczego”
  h += '<section class="blk"><div class="wrap">' + (P.stats ? '<div class="stats">' + P.stats.map(function (s) { return '<div><b>' + esc(s.value) + '</b><span>' + esc(s.label) + '</span></div>'; }).join('') + '</div>' : '') +
    (X.wow ? '<div class="wow">' + X.wow.map(function (w) { return '<p>' + esc(w) + '</p>'; }).join('') + '</div>' : '') + '</div></section>';
  // trasa objazdu: schematyczna mapa z punktami etapów (rzut z lat/lon)
  var ET = (P.etapy || []).filter(function (e) { return e.lat != null && e.lon != null; });
  if (ET.length) {
    var MDZ = { lat: -32.83, lon: -68.79 }, all = ET.concat([MDZ]);
    var la0 = Math.min.apply(null, all.map(function (e) { return e.lat; })) - .25, la1 = Math.max.apply(null, all.map(function (e) { return e.lat; })) + .25;
    var lo0 = Math.min.apply(null, all.map(function (e) { return e.lon; })) - .45, lo1 = Math.max.apply(null, all.map(function (e) { return e.lon; })) + .45;
    var VW = 520, VH = Math.round(VW * (la1 - la0) / ((lo1 - lo0) * Math.cos(33 * Math.PI / 180)));
    VH = Math.max(300, Math.min(480, VH));
    function xy(e) { return [((e.lon - lo0) / (lo1 - lo0) * VW), ((la1 - e.lat) / (la1 - la0) * VH)]; }
    var pts = [xy(MDZ)].concat(ET.map(xy)).concat([xy(MDZ)]);
    var andes = ''; for (var i = 0; i < 9; i++) { var yy = VH * i / 8, w = 60 + (i % 3) * 18; andes += (i ? 'L' : 'M') + (w).toFixed(0) + ' ' + yy.toFixed(0) + ' '; }
    var peaks = ''; for (var i = 0; i < 7; i++) { var y = VH * (i + .5) / 7, x = 28 + (i % 2) * 14; peaks += '<path class="snow" d="M' + (x - 14) + ' ' + (y + 12) + ' L' + x + ' ' + (y - 10) + ' L' + (x + 14) + ' ' + (y + 12) + 'Z"/>'; }
    var svg = '<svg viewBox="0 0 ' + VW + ' ' + VH + '" role="img" aria-label="Mapa trasy objazdu"><path class="andes" d="M0 0 ' + andes + 'L0 ' + VH + 'Z"/>' + peaks +
      '<text class="sub" x="10" y="' + (VH - 10) + '">Andy · granica z Chile</text>' +
      '<path class="rt" d="M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L') + '"/>' +
      '<circle class="ap" cx="' + pts[0][0] + '" cy="' + pts[0][1] + '" r="7"/><text class="lab" x="' + (pts[0][0] + 12) + '" y="' + (pts[0][1] + 4) + '">Mendoza · lotnisko</text>' +
      ET.map(function (e, i) { var p = xy(e), left = p[0] > VW * .45; return '<circle class="pt" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="15"/><text class="pn" x="' + p[0].toFixed(1) + '" y="' + (p[1] + 4.5).toFixed(1) + '" text-anchor="middle">' + (i + 1) + '</text>' +
        '<text class="lab" x="' + (p[0] + (left ? -22 : 22)).toFixed(1) + '" y="' + (p[1] + 4).toFixed(1) + '" text-anchor="' + (left ? 'end' : 'start') + '">' + esc(e.nazwa) + '</text>'; }).join('') + '</svg>';
    h += '<section class="blk" id="trasa"><div class="wrap"><div class="sh"><div><p class="eyebrow">Objazd busem z kierowcą · ' + ET.reduce(function (a, e) { return a + (+e.noce || 0); }, 0) + ' nocy</p><h2>Trasa</h2><p>Spokojny objazd z lotniska w Mendozie: najpierw baza pod miastem z wypadem w wysokie Andy, potem dolina Uco z Zuccardi. Poza dniem pod Aconcaguą żaden przejazd nie trwa dłużej niż półtorej godziny.</p></div></div>' +
      '<div class="route"><div><div class="map" id="map"><div class="lmap" id="lmap"></div>' + svg + '</div><p class="mapnote" id="mapnote"></p></div><ol class="stg">' + ET.map(function (e, i) {
        return '<li><span class="n">' + (i + 1) + '</span><div><h3>' + esc(e.nazwa) + '</h3><span class="meta">' + esc(e.noce) + ' ' + (+e.noce === 1 ? 'noc' : 'noce') + (e.rate ? ' · ok. ' + e.rate + ' ' + (e.cur || 'USD') + ' za noc' : '') + '</span>' +
          '<p><b>' + (e.hotel_url ? '<a href="' + esc(e.hotel_url) + '" target="_blank" rel="noopener">' + esc(e.hotel) + '</a>' : esc(e.hotel || '')) + '</b>' + (e.alt ? ' · alternatywa: ' + (e.alt_url ? '<a href="' + esc(e.alt_url) + '" target="_blank" rel="noopener">' + esc(e.alt) + '</a>' : esc(e.alt)) : '') + '</p>' +
          (e.opis ? '<p>' + esc(e.opis) + '</p>' : '') + '</div></li>';
      }).join('') + '</ol></div></div></section>';
  }
  // plan dnia
  h += '<section class="blk" id="plan" style="background:var(--paper)"><div class="wrap"><div class="sh"><div><p class="eyebrow">Dzień po dniu</p><h2>Osiem dni w dolinie</h2><p>Rano szlak albo winnica, w południe długi lunch, wieczorem zachód słońca nad Andami. 10 listopada należy do Zuccardi.</p></div></div>' +
    (X.dayflow ? '<ul class="flow" aria-label="Typowy dzień">' + X.dayflow.map(function (f) { return '<li><b>' + esc(f[0]) + '</b>' + esc(f[1]) + '</li>'; }).join('') + '</ul><div style="height:26px"></div>' : '') +
    '<ol class="days" style="list-style:none;margin:0;padding:0">' + D.days.map(function (d) {
      return '<li class="day' + (d.anniv ? ' anniv' : '') + '">' + (d.img ? '<figure class="ph" style="margin:0">' + img(d.img) + '<figcaption>' + esc(d.img.cap) + cred(d.img) + '</figcaption></figure>' : '<div class="ph"><canvas class="scn" data-k="' + esc(d.k || 'gory') + '" data-seed="' + (D.days.indexOf(d) + 3) + '" data-anniv="' + (d.anniv ? 1 : 0) + '" aria-hidden="true"></canvas></div>') +
        '<div class="bd"><div class="dt"><b>' + esc(d.date) + '</b><span>' + esc(d.dow || '') + '</span>' + (d.anniv ? ' <span class="tag">rocznica</span>' : '') + '</div><h3>' + esc(d.title) + '</h3><p>' + esc(d.text) + '</p>' +
        (d.cost ? '<span class="cost">ok. ' + nf(d.cost) + ' zł na parę tego dnia</span>' : '') + '</div></li>';
    }).join('') + '</ol></div></section>';
  // hotele i budżet
  var BL = [['nocleg', 'Noclegi (7 nocy)', 'c1'], ['loty', 'Loty', 'c2'], ['auto_transfery', 'Bus z kierowcą', 'c3'], ['jedzenie', 'Jedzenie', 'c4'], ['wycieczki_bilety', 'Wycieczki i degustacje', 'c5'], ['rezerwa', 'Rezerwa', 'c6']];
  // hotele: karty z rolą w trasie, za/przeciw, oceną i linkiem
  if (D.hotele && D.hotele.length) {
    h += '<section class="blk" id="hotele"><div class="wrap"><div class="sh"><div><p class="eyebrow">Dwie bazy, pięć opcji</p><h2>Hotele</h2><p>Hotele w stylu, który lubicie: butikowe, ciche, z widokiem i designem, wysoko oceniane. Pierwsze trzy noce pod Mendozą, cztery w dolinie Uco. Ceny to szacunki za pokój dla dwojga.</p></div></div><div class="hg">' +
      D.hotele.map(function (o) {

  h += '<section class="blk" id="budzet"><div class="wrap"><div class="sh"><div><p class="eyebrow">Baza i koszty</p><h2>Wariant i budżet</h2><p>Zuccardi nie ma noclegów, więc śpimy w dwóch miejscach: 3 noce pod Mendozą i 4 noce w dolinie Uco. Wybierzcie wariant trasy, a budżet przeliczy się na parę.</p></div></div>' +

  // przygotowania
  // loty: opcje, kalendarz zakupu, alerty i monitor cen (loty.json aktualizuje agent)

  // monitor cen: loty.json obok strony
  (function () {

      var o = M.status ? '<p class="status">' + esc(M.status) + '</p>' : '';
      var all = []; S.forEach(function (s) { (s.hist || []).forEach(function (x) { if (x.cena) all.push(x.cena); }); });
      var mx = all.length ? Math.max.apply(null, all) : 0;
      function last(s) { var hh = (s.hist || []).filter(function (x) { return x.cena; }); return hh.length ? hh[hh.length - 1] : null; }
      function prev(s) { var hh = (s.hist || []).filter(function (x) { return x.cena; }); return hh.length > 1 ? hh[hh.length - 2] : null; }
      var rows = S.slice().sort(function (a, b) { var la = last(a), lb = last(b); return (la ? la.cena : 1e9) - (lb ? lb.cena : 1e9); });
      o += '<div class="ptw"><table class="pt"><thead><tr><th>Linia · trasa</th><th>Teraz</th><th>Trend</th><th>Min</th><th>Historia</th></tr></thead><tbody>' + rows.map(function (s) {
        var l = last(s), p = prev(s), hh = (s.hist || []).filter(function (x) { return x.cena; }), mn = hh.length ? Math.min.apply(null, hh.map(function (x) { return x.cena; })) : null;
        var tr = '<span class="tr fl">—</span>';
        if (l && p) { var d = l.cena - p.cena; tr = d > 0 ? '<span class="tr up">▲ +' + d + ' zł</span>' : d < 0 ? '<span class="tr dn">▼ ' + d + ' zł</span>' : '<span class="tr fl">= bez zmian</span>'; }
        var now = l ? '<b>' + l.cena + ' zł</b>' : '<span class="or" title="widełki orientacyjne, rozkład jeszcze nieotwarty">' + esc(s.orient || '—') + '</span>';
        var sp = hh.length ? '<span class="sp">' + hh.slice(-12).map(function (x) { return '<i class="' + (x.cena <= prog ? 'ok' : '') + '" style="height:' + Math.max(3, 22 * x.cena / mx) + 'px" title="' + x.data + ': ' + x.cena + ' zł"></i>'; }).join('') + '</span>' : '<span class="tr fl">brak odczytów</span>';
        return '<tr' + (l && l.cena <= prog ? ' class="ok"' : '') + '><td><b>' + esc(s.linia) + '</b><span class="rt">' + esc(s.trasa) + (s.uwagi ? ' · ' + esc(s.uwagi) : '') + '</span></td><td class="n">' + now + '</td><td>' + tr + '</td><td class="n">' + (mn ? mn + ' zł' : '—') + '</td><td>' + sp + '</td></tr>';
      }).join('') + '</tbody></table></div>';
      box.innerHTML = o;
    }).catch(function () { st.textContent = 'Monitor niedostępny w tym podglądzie.'; });
  })();
  // prawdziwa mapa (OpenStreetMap przez Leaflet); gdy kafelki nie dochodzą (np. w podglądzie Claude), zostaje mapa schematyczna
  (function () {
    var pts = D.mapa, box = document.getElementById('map'), note = document.getElementById('mapnote');
    if (!pts || !pts.length || !window.L || !box) return;

    var tl = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { subdomains: 'abc', maxZoom: 15, attribution: '© OpenStreetMap, SRTM · © OpenTopoMap (CC-BY-SA)' }).addTo(m);
    tl.on('load', function () { if (!ok) { ok = true; box.classList.add('live'); m.invalidateSize(); m.fitBounds(bounds, { padding: [24, 24] }); note.textContent = 'Mapa topograficzna: OpenTopoMap. Kółka z numerem to kolejne miejsca planu, większe to noclegi i rocznica.'; } });
    tl.on('tileerror', function () { if (!ok) { setTimeout(function () { if (!ok) { m.remove(); note.textContent = 'Prawdziwa mapa dostępna w wersji na stronie (link w stopce); tu mapa schematyczna.'; } }, 4000); } });
    var bounds = L.latLngBounds(pts.map(function (p) { return [p.lat, p.lon]; }));
    pts.forEach(function (p, i) {
      var cls = 'mk' + (p.baza ? ' base' : '') + (p.anniv ? ' anniv' : ''), lab = p.baza ? '🛏' : p.anniv ? '♥' : String(i + 1);
      L.marker([p.lat, p.lon], { icon: L.divIcon({ className: '', html: '<div class="' + cls + '">' + lab + '</div>', iconSize: [34, 34], iconAnchor: [17, 17] }) }).addTo(m).bindPopup('<b>' + esc(p.n) + '</b><br>' + esc(p.d));
    });
    L.polyline(pts.filter(function (p) { return !/opcja/.test(p.d); }).map(function (p) { return [p.lat, p.lon]; }), { color: '#6b1d3a', weight: 3, dashArray: '7 6' }).addTo(m);
    m.fitBounds(bounds, { padding: [24, 24] });
  })();

  // wybór hotelu → budżet
  var cur = Math.min(load('h', 0), D.hotels.length - 1);
  function bud() {
    var o = D.hotels[cur], b = o.b, t = b.razem;
    document.querySelectorAll('.hc').forEach(function (el) { el.setAttribute('aria-pressed', +el.dataset.h === cur ? 'true' : 'false'); });
    document.getElementById('bud').innerHTML = '<div class="total"><div><p class="eyebrow">Budżet na parę · ' + esc(o.n.replace(/^Trasa: /, '')) + '</p><b>' + nf(t) + ' zł</b></div><span class="limit">' + (t <= 26000 ? 'zapas ' + nf(26000 - t) + ' zł do limitu 26 000 zł' : 'ponad limit o ' + nf(t - 26000) + ' zł') + '</span></div>' +
      '<div class="bar" role="img" aria-label="Podział budżetu">' + BL.map(function (r) { return b[r[0]] ? '<i class="' + r[2] + '" style="width:' + (b[r[0]] / t * 100).toFixed(2) + '%" title="' + r[1] + '"></i>' : ''; }).join('') + '</div>' +
      '<ul class="leg">' + BL.map(function (r) { return b[r[0]] != null ? '<li><s class="' + r[2] + '"></s>' + r[1] + '<b>' + nf(b[r[0]]) + ' zł</b></li>' : ''; }).join('') + '</ul>' +
      (o.note ? '<p class="note">' + esc(o.note) + '</p>' : '') + (o.url ? '<p class="note"><a href="' + esc(o.url) + '" target="_blank" rel="noopener">Strona hotelu ↗</a></p>' : '');
  }
  document.querySelectorAll('.hc').forEach(function (el) { el.addEventListener('click', function () { cur = +el.dataset.h; save('h', cur); bud(); }); });
  bud();
  // lista „co zabrać”
  var z = load('z', {});
  document.querySelectorAll('[data-z]').forEach(function (c) { c.checked = !!z[c.dataset.z]; c.addEventListener('change', function () { z[c.dataset.z] = c.checked; save('z', z); }); });
  // ilustracje: generowane pejzaże doliny Uco (Andy, winnice, topole), gdy brak zdjęcia
  function rnd(seed) { var x = seed * 9301 + 49297; return function () { x = (x * 9301 + 49297) % 233280; return x / 233280; }; }
  function paint(cv) {
    var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height));
    cv.width = W * dpr; cv.height = H * dpr; var c = cv.getContext('2d'); c.scale(dpr, dpr);
    var k = cv.dataset.k, R = rnd(+cv.dataset.seed || 1), ann = cv.dataset.anniv === '1';
    var sky = { hero: ['#2c1b2e', '#a24d5c', '#f0b37a'], gory: ['#5f8fc1', '#a9c8e6', '#eef3f6'], wino: ['#4a2a4a', '#c1666b', '#f5c98b'], jedzenie: ['#2a2038', '#8a3f55', '#e89a5c'], miasto: ['#7aa6cf', '#c4dbe9', '#f3efe6'] }[ann ? 'wino' : k] || ['#5f8fc1', '#a9c8e6', '#eef3f6'];
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, sky[0]); g.addColorStop(.55, sky[1]); g.addColorStop(1, sky[2]); c.fillStyle = g; c.fillRect(0, 0, W, H);
    // słońce
    var sx = W * (.2 + R() * .6), sy = H * (k === 'gory' || k === 'miasto' ? .22 : .5);
    var sg = c.createRadialGradient(sx, sy, 0, sx, sy, H * .35); sg.addColorStop(0, 'rgba(255,236,200,.95)'); sg.addColorStop(.12, 'rgba(255,220,170,.8)'); sg.addColorStop(1, 'rgba(255,220,170,0)');
    c.fillStyle = sg; c.fillRect(0, 0, W, H);
    // pasma Andów: od najdalszego, z czapami śniegu
    var layers = [['rgba(110,96,128,.55)', .30, .26], ['rgba(78,64,92,.75)', .42, .2], ['rgba(52,42,60,.92)', .55, .14]];
    if (k === 'gory') layers = [['rgba(120,140,170,.6)', .26, .3], ['rgba(80,100,128,.8)', .40, .24], ['rgba(56,70,88,.95)', .56, .16]];
    layers.forEach(function (L, li) {
      var base = H * L[1], amp = H * L[2], pts = [], n = 7 + Math.round(R() * 5);
      for (var i = 0; i <= n; i++) pts.push([W * i / n + (R() - .5) * W / n * .5, base - amp * (.35 + R() * .65)]);
      c.beginPath(); c.moveTo(0, H); pts.forEach(function (p, i) { if (i === 0) c.lineTo(0, p[1]); c.lineTo(p[0], p[1]); }); c.lineTo(W, pts[pts.length - 1][1]); c.lineTo(W, H); c.closePath(); c.fillStyle = L[0]; c.fill();
      if (li === 0) { c.fillStyle = 'rgba(255,255,255,.85)'; pts.forEach(function (p) { if (p[1] < base - amp * .7) { c.beginPath(); c.moveTo(p[0] - amp * .18, p[1] + amp * .16); c.lineTo(p[0], p[1]); c.lineTo(p[0] + amp * .18, p[1] + amp * .16); c.closePath(); c.fill(); } }); }
    });
    // ziemia
    var gy = H * .62, gg = c.createLinearGradient(0, gy, 0, H); gg.addColorStop(0, k === 'gory' ? '#7d8a5c' : '#6f7a45'); gg.addColorStop(1, '#3d3a24'); c.fillStyle = gg; c.fillRect(0, gy, W, H - gy);
    if (k === 'wino' || k === 'hero' || ann) {
      // rzędy winorośli zbiegające się w perspektywie
      var vx = W * (.35 + R() * .3); c.strokeStyle = 'rgba(36,52,24,.85)';
      for (var i = -14; i <= 14; i++) { c.lineWidth = 2 + Math.abs(i) * .25; c.beginPath(); c.moveTo(vx + i * 4, gy); c.lineTo(vx + i * W * .11, H); c.stroke(); }
    }
    // topole — znak rozpoznawczy doliny
    var np = k === 'miasto' ? 14 : 7;
    for (var p = 0; p < np; p++) {
      var px = R() * W, ph = H * (.14 + R() * .14), pw = ph * .14, py = gy + R() * H * .05;
      c.fillStyle = 'rgba(34,48,26,.95)'; c.beginPath(); c.ellipse(px, py - ph / 2, pw, ph / 2, 0, 0, Math.PI * 2); c.fill();
    }
    if (ann) { c.fillStyle = 'rgba(255,240,225,.9)'; c.font = '600 ' + Math.round(H * .07) + 'px Gloock, Georgia, serif'; c.textAlign = 'right'; c.fillText('10.11', W - 14, H - 14); }
  }
  function paintAll() { document.querySelectorAll('canvas.scn').forEach(paint); }
  paintAll(); addEventListener('resize', function () { clearTimeout(paintAll.t); paintAll.t = setTimeout(paintAll, 150); });

    var dark = r.getAttribute('data-theme') ? r.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

  addEventListener('scroll', function () { var y = scrollY + 120, on = null; links.forEach(function (a) { var s = document.querySelector(a.getAttribute('href')); if (s && s.offsetTop <= y) on = a; }); links.forEach(function (a) { a.classList.toggle('on', a === on); }); }, { passive: true });
})();
