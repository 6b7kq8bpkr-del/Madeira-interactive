name: Valle de Uco – strażnik raportu
# Sprawdza ostatni raport, którego termin już minął, także przy opóźnieniu GitHub Actions.
on:
  schedule:
    - cron: '27 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sprawdź ostatni wymagany raport lotów
        shell: bash
        run: |
          set -euo pipefail
          # Termin raportu: 18:00 UTC (19:00 zimą, 20:00 latem w Warszawie).
          # Po północy termin bieżącego dnia jeszcze nie minął.
          oczekiwany=$(date -u -d '18 hours ago' +%F)
          dzis=$(TZ=Europe/Warsaw date +%F)
          adres=https://6b7kq8bpkr-del.github.io/Madeira-interactive/rocznica-2027/uco/loty.json
          curl -fsS --retry 3 --connect-timeout 10 --max-time 30 "$adres?t=$(date +%s)" |
            python3 -c '
          from datetime import date
          import json, sys

          wymagany, dzis = map(date.fromisoformat, sys.argv[1:])
          raport = date.fromisoformat(json.load(sys.stdin)["raport"]["data"])
          print(f"Najstarszy akceptowalny raport: {wymagany}; opublikowany: {raport}")
          if not wymagany <= raport <= dzis:
              sys.exit(f"::error::Raport lotów ma datę {raport}; oczekiwano daty między {wymagany} a {dzis}.")
          ' "$oczekiwany" "$dzis"
